<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Meta responsive -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acceso | Hospital</title>

    <!-- Bootstrap CSS (base de componentes y pills) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Fuente e íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

    <!-- Estilos propios (override de colores y cabecera) -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="d-flex align-items-start justify-content-center min-vh-100">
    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <!-- Card principal -->
                <div class="card shadow-lg border-0">

                    <!-- Barra azul superior + panel blanco centrado (como tu referencia) -->
                    <div class="brand-bar">
                        <div class="brand-panel">
                            <div class="brand-logo"><i class="fa-solid fa-hospital"></i></div>
                            <div>
                                <h1 class="h4 fw-bold mb-0 text-brand">Hospital</h1>
                                <small class="text-muted">Bogota d.c.</small>
                            </div>
                        </div>
                    </div>

                    <!-- Cuerpo -->
                    <div class="card-body p-4 p-sm-5">
                        <!-- Tabs Bootstrap: defino login como activo al cargar -->
                        <ul class="nav nav-pills justify-content-center gap-2 mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="tab-login" data-bs-toggle="pill"
                                    data-bs-target="#pane-login" type="button" role="tab" aria-controls="pane-login"
                                    aria-selected="true">
                                    <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Iniciar sesión
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="tab-register" data-bs-toggle="pill"
                                    data-bs-target="#pane-register" type="button" role="tab"
                                    aria-controls="pane-register" aria-selected="false">
                                    <i class="fa-solid fa-user-plus me-1"></i> Registrarme
                                </button>
                            </li>
                        </ul>

                        <!-- Contenido de tabs -->
                        <div class="tab-content" id="authTabsContent">
                            <!-- PANE LOGIN: visible por 'show active' incluso sin JS -->
                            <div class="tab-pane fade show active" id="pane-login" role="tabpanel"
                                aria-labelledby="tab-login" tabindex="0">
                                <form novalidate>
                                    <!-- Email/cedula -->
                                    <div class="mb-3">
                                        <label for="loginId" class="form-label fw-semibold">Email o Nº de
                                            documento</label>
                                        <div class="input-group input-group-lg">
                                            <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                                            <input type="text" class="form-control" id="loginId"
                                                placeholder="usuario@correo.com / cedula" required>
                                        </div>
                                        <div class="form-text">Usá tu correo registrado o tu documento.</div>
                                    </div>
                                    <!-- Contraseña -->
                                    <div class="mb-2">
                                        <label for="loginPass" class="form-label fw-semibold">Contraseña</label>
                                        <div class="input-group input-group-lg">
                                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                            <input type="password" class="form-control" id="loginPass"
                                                placeholder="••••••••" minlength="6" required>
                                        </div>
                                    </div>
                                    <!-- Recordarme + Recupero -->
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="rememberMe">
                                            <label class="form-check-label" for="rememberMe">Recordarme</label>
                                        </div>
                                        <a href="#" class="link-primary fw-semibold">¿Olvidaste tu contraseña?</a>
                                    </div>
                                    <!-- CTA -->
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-success btn-lg">
                                            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Iniciar sesión
                                        </button>
                                    </div>
                                </form>

                                <!-- Divisor -->
                                <div class="text-center my-4">
                                    <span class="divider-text">¿Nuevo paciente?</span>
                                </div>

                                <!-- CTA a registro -->
                                <!-- <div class="d-grid">
                                    <a class="btn btn-outline-primary btn-lg" data-bs-toggle="pill"
                                        href="#pane-register" role="tab" aria-controls="pane-register"
                                        aria-selected="false">
                                        <i class="fa-solid fa-user-plus me-2"></i>Registrate aquí
                                    </a>
                                </div> -->
                            </div>

                            <!-- PANE REGISTRO: oculto hasta que se seleccione la tab -->
                            <div class="tab-pane fade" id="pane-register" role="tabpanel" aria-labelledby="tab-register"
                                tabindex="0">
                                <form novalidate>
                                    <div class="row g-3">
                                        <div class="col-12 col-md-6">
                                            <label class="form-label fw-semibold" for="regNombre">Nombre</label>
                                            <input id="regNombre" class="form-control form-control-lg" required>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label fw-semibold" for="regApellido">Apellido</label>
                                            <input id="regApellido" class="form-control form-control-lg" required>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label fw-semibold" for="regDoc">Documento</label>
                                            <input id="regDoc" class="form-control form-control-lg"
                                                placeholder="cedula / Pasaporte" required>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label fw-semibold" for="regTel">Teléfono</label>
                                            <input id="regTel" class="form-control form-control-lg"
                                                placeholder="(0221) 123-4567">
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label fw-semibold" for="regEmail">Correo
                                                electrónico</label>
                                            <input id="regEmail" type="email" class="form-control form-control-lg"
                                                required>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label fw-semibold" for="regEmail">Eps</label>
                                            <input id="regEmail" type="email" class="form-control form-control-lg"
                                                required>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label fw-semibold" for="regEmail">Numero de
                                                afiliado</label>
                                            <input id="regEmail" type="email" class="form-control form-control-lg"
                                                required>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label fw-semibold" for="regPass">Contraseña</label>
                                            <input id="regPass" type="password" class="form-control form-control-lg"
                                                minlength="6" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label fw-semibold" for="regPass2">Repetir
                                                contraseña</label>
                                            <input id="regPass2" type="password" class="form-control form-control-lg"
                                                minlength="6" required>
                                        </div>
                                    </div>
                                    <div class="form-check my-3">
                                        <input class="form-check-input" type="checkbox" id="regTerms" required>
                                        <label class="form-check-label" for="regTerms">Acepto los términos y
                                            condiciones</label>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-success btn-lg">
                                            <i class="fa-solid fa-user-check me-2"></i>Crear cuenta
                                        </button>
                                        <a class="btn btn-outline-primary btn-lg" data-bs-toggle="pill"
                                            href="#pane-login" role="tab" aria-controls="pane-login"
                                            aria-selected="false">
                                            <i class="fa-solid fa-arrow-left me-2"></i>Volver a Iniciar sesión
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div><!-- /card-body -->
                </div><!-- /card -->
            </div>
        </div>
    </main>

    <!-- Bootstrap JS bundle: necesario para tabs (data-bs-toggle="pill") -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
